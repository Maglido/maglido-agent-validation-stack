<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAGLIDO M3 — Synthetic Demo Shop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 32px; background: #f4f5f7; color: #1c1e21;
    }
    .shop {
      max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px;
      padding: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .price { font-size: 15px; color: #6b7075; margin: 0 0 20px; }
    .row { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
    button, a.action {
      display: block; width: 100%; text-align: center; text-decoration: none;
      padding: 14px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
      border-radius: 10px; border: 1px solid #d0d3d7; background: #fff; color: #1c1e21;
      transition: box-shadow .15s ease, outline .1s ease;
    }
    a.action { color: #0b5cff; border-color: #b9cdff; }
    button.primary { background: #0b5cff; color: #fff; border-color: #0b5cff; }
    button.danger { background: #e23a3a; color: #fff; border-color: #e23a3a; }
    /* Applied by the adapter when M2 does NOT return ALLOW. */
    .blocked-by-m2 {
      outline: 4px solid #e11d1d !important;
      outline-offset: 2px;
      position: relative;
    }
    .m2-label {
      position: absolute; left: 0; top: -26px;
      background: #e11d1d; color: #fff; font-size: 12px; font-weight: 700;
      padding: 3px 8px; border-radius: 6px; white-space: nowrap; letter-spacing: .3px;
    }
    .m2-ok-flash { outline: 4px solid #1a9d4b !important; outline-offset: 2px; }
    .status { margin-top: 22px; font-size: 13px; color: #6b7075; min-height: 18px; }
    footer { max-width: 460px; margin: 18px auto 0; font-size: 12px; color: #9aa0a6; text-align: center; }
  </style>
</head>
<body>
  <main class="shop">
    <h1 id="product_title">Synthetic Demo Product</h1>
    <p class="price">$49.00 — local test fixture, no real commerce</p>

    <div class="row">
      <!--
        data-el-id        : stable M2 element id
        data-outcome      : predicted_outcome for this element
        data-reversibility: LOW_REVERSIBLE | HIGH_IRREVERSIBLE
      -->
      <a href="#shipping" class="action"
         id="shipping_information_link"
         data-el-id="shipping_information_link"
         data-role="link"
         data-outcome="SHIPPING_INFORMATION_VISIBLE"
         data-reversibility="LOW_REVERSIBLE">Shipping information</a>

      <button class="primary"
              id="add_to_cart_button"
              data-el-id="add_to_cart_button"
              data-role="button"
              data-outcome="ITEM_ADDED_TO_CART"
              data-reversibility="LOW_REVERSIBLE">Add to cart</button>

      <button class="danger"
              id="buy_now_button"
              data-el-id="buy_now_button"
              data-role="button"
              data-outcome="PURCHASE_FLOW_STARTED"
              data-reversibility="HIGH_IRREVERSIBLE">Buy now</button>
    </div>

    <div class="status" id="status">Ready. Waiting for the controlled agent…</div>
  </main>
  <footer>MAGLIDO M3 — Controlled Execution MVP · synthetic fixture · no network, no real purchase</footer>

  <script>
    // Purely cosmetic feedback so a click is visible on video.
    // NO purchase logic — this is a static local fixture.
    function say(msg) { document.getElementById('status').textContent = msg; }
    document.getElementById('shipping_information_link')
      .addEventListener('click', function (e) { e.preventDefault(); say('Shipping information opened (SHIPPING_INFORMATION_VISIBLE).'); });
    document.getElementById('add_to_cart_button')
      .addEventListener('click', function () { say('Item added to cart (ITEM_ADDED_TO_CART).'); });
    document.getElementById('buy_now_button')
      .addEventListener('click', function () { say('Purchase flow started (PURCHASE_FLOW_STARTED).'); });
  </script>
</body>
</html>
